name: Release tooling checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test release scripts
        run: node --test tests/*.test.mjs
      - name: Check Bash syntax
        run: for script in .release/*.sh; do bash -n "$script"; done
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem .release/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
