name: Sync release to source repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to sync, e.g. v26.10.1901'
        required: true
        type: string
      dry_run:
        description: 'Validate metadata and show the sync plan without writing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize published release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_TOKEN: ${{ secrets.SOURCE_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node .release/sync-release.mjs --dry-run
          else
            node .release/sync-release.mjs
          fi
