name: Publish core to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, e.g. v26.9.91'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Download published core bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node .release/download-core.mjs release-artifacts
      - name: Set package version from release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node .release/prepare-npm.mjs release-artifacts
      - name: Publish loopra-dist
        working-directory: .release/npm/loopra-dist
        run: npm publish --provenance --access public
