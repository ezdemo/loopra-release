name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Automatically publish the release after building (off: build only)'
        type: boolean
        default: true
      build_android:
        description: 'Build an Android ARM64 debug APK and include it when publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: loopra-release
  cancel-in-progress: false

env:
  LOOPRA_SOURCE_DIR: ${{ github.workspace }}/source

jobs:
  # Resolve main once so every package is built from the same source commit.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout LoopraX main
        uses: actions/checkout@v7
        with:
          repository: ezdemo/loopra
          ref: main
          path: source
          fetch-depth: 0
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reserve Shanghai date version and update build sources
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/source-metadata.mjs source
      - name: Refuse to overwrite a published release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/check-release.mjs
      - name: Generate release changes from source commits
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_BASE_URL: ${{ vars.RELEASE_NOTES_BASE_URL || 'https://amr-link.open-design.ai/v1' }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'deepseek-v4-pro' }}
        run: node .release/generate-notes.mjs source
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          overwrite: true
          path: |
            release-metadata.json
            release-changes.md
          if-no-files-found: error
          retention-days: 7

  # LoopraX cross-compiles with CGO disabled, so one Linux runner can produce
  # the service binaries and desktop apps for every target in package-matrix.txt.
  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned LoopraX main
        uses: actions/checkout@v7
        with:
          repository: ezdemo/loopra
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Apply the reserved build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .release/set-version.mjs source "$RELEASE_VERSION"

      - name: Install Windows installer compiler
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Install icon dependency
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: python3 -m pip install pillow

      - name: Package LoopraX
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash source/scripts/package.sh --out "$GITHUB_WORKSPACE/dist"

      - name: Stage release packages
        run: node .release/stage-assets.mjs dist release-packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: looprax-packages
          overwrite: true
          path: release-packages/*
          if-no-files-found: error
          retention-days: 7

  # Android is optional, but must finish successfully before a release includes it.
  package-android:
    if: inputs.build_android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout pinned Loopra main
        uses: actions/checkout@v7
        with:
          repository: ezdemo/loopra
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: android-metadata
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare Rust and Android toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build and verify Android debug APK
        run: bash .release/build-android.sh source android-artifact android-metadata/release-metadata.json
      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: loopra-android-arm64-debug
          path: android-artifact/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      ${{ !cancelled() && inputs.create_release &&
          needs.prepare.result == 'success' && needs.package.result == 'success' &&
          (needs['package-android'].result == 'success' ||
           (!inputs.build_android && needs['package-android'].result == 'skipped')) }}
    needs: [prepare, package, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release-artifacts
      - name: Download desktop and service packages
        uses: actions/download-artifact@v8
        with:
          name: looprax-packages
          path: release-artifacts
      - name: Download Android debug package
        if: inputs.build_android
        uses: actions/download-artifact@v8
        with:
          name: loopra-android-arm64-debug
          path: release-artifacts/android
      - name: Prepare packages and release notes
        env:
          INCLUDE_ANDROID: ${{ inputs.build_android }}
        run: node .release/prepare-assets.mjs release-artifacts
      # Upload into a temporary draft so users never see incomplete packages.
      - name: Upload release packages
        id: upload_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LoopraX v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Verify packages and publish release automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.upload_release.outputs.id }}
        run: node .release/publish-release.mjs

  # Releases published with GITHUB_TOKEN do not emit workflow-triggering release
  # events. Dispatch the follow-up workflows explicitly so each can fail alone.
  dispatch-source-sync:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start source release synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: gh workflow run sync-release.yml --ref main -f "tag=$RELEASE_TAG"

  dispatch-changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Archive release notes in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run changelog.yml --ref main
