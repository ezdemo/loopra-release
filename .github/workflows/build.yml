name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Automatically publish the release after building (off: build only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: loopra-release
  cancel-in-progress: false

env:
  LOOPRA_SOURCE_DIR: ${{ github.workspace }}/source

jobs:
  # Resolve main once so every package is built from the same source commit.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout LoopraX main
        uses: actions/checkout@v7
        with:
          repository: ezdemo/loopra
          ref: main
          path: source
          fetch-depth: 0
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reserve Shanghai date version and update build sources
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/source-metadata.mjs source
      - name: Refuse to overwrite a published release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/check-release.mjs
      - name: Generate release changes from source commits
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_BASE_URL: ${{ vars.RELEASE_NOTES_BASE_URL || 'https://amr-link.open-design.ai/v1' }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'deepseek-v4-pro' }}
        run: node .release/generate-notes.mjs source
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          overwrite: true
          path: |
            release-metadata.json
            release-changes.md
          if-no-files-found: error
          retention-days: 7

  # LoopraX cross-compiles with CGO disabled, so one Linux runner can produce
  # the service binaries and desktop apps for every target in package-matrix.txt.
  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned LoopraX main
        uses: actions/checkout@v7
        with:
          repository: ezdemo/loopra
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Apply the reserved build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .release/set-version.mjs source "$RELEASE_VERSION"

      - name: Install icon dependency
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: python3 -m pip install pillow || echo "::warning::Pillow is unavailable; Windows and macOS packages will not have icons"

      - name: Package LoopraX
        run: bash source/scripts/package.sh --out "$GITHUB_WORKSPACE/dist"

      - name: Stage release packages
        run: node .release/stage-assets.mjs dist release-packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: looprax-packages
          overwrite: true
          path: release-packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: inputs.create_release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Prepare packages and release notes
        run: node .release/prepare-assets.mjs release-artifacts
      # Upload into a temporary draft so users never see incomplete packages.
      - name: Upload release packages
        id: upload_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LoopraX v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Verify packages and publish release automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.upload_release.outputs.id }}
        run: node .release/publish-release.mjs

  # Releases published with GITHUB_TOKEN do not emit workflow-triggering release
  # events. Dispatch the follow-up workflows explicitly so each can fail alone.
  dispatch-source-sync:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start source release synchronization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: gh workflow run sync-release.yml --ref main -f "tag=$RELEASE_TAG"

  dispatch-changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Archive release notes in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run changelog.yml --ref main
